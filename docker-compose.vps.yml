services:
  db:
    mem_limit: 256m
    memswap_limit: 512m
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
      -c effective_cache_size=128MB
      -c wal_buffers=4MB
      -c checkpoint_timeout=15min
      -c checkpoint_completion_target=0.9
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sports-stats-api: # Имя совпадает с базовым файлом, тут всё ок
    mem_limit: 256m
    memswap_limit: 512m
    restart: unless-stopped
    environment:
      DOTNET_gcServer: "0"
      DOTNET_GCHeapHardLimit: "0x10000000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sports-stats-generator: # <--- ДОБАВЛЕНО: тоже ограничиваем, чтобы не съел память при старте
    mem_limit: 256m
    memswap_limit: 512m
    restart: "no" # Оставляем как в базовом файле, он должен отработать и завершиться